<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event vorschlagen - Meissen Kalender</title>
<style>
:root{--bg:#1e1c18;--card:#2a2824;--text:#f0ece1;--muted:#a8a29a;--border:#3a3732}
body{font-family:system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text);padding:20px}
h1{max-width:600px;margin:0 auto 20px}
form{max-width:600px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;display:grid;gap:14px}
label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#11110f;color:var(--text);font-size:15px;box-sizing:border-box}
textarea{min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat-verein{color:#60a5fa} .cat-spieleabend{color:#4ade80} .cat-markt{color:#facc15}
.btn{padding:12px;border-radius:999px;border:0;background:var(--text);color:#111;font-weight:800;cursor:pointer;font-size:16px}
.btn2{padding:8px 12px;border-radius:10px;background:var(--border);color:var(--text);border:0;cursor:pointer;font-size:13px}
#output{max-width:600px;margin:20px auto;background:#11110f;border:1px dashed var(--border);border-radius:12px;padding:16px}
code{white-space:pre-wrap;word-break:break-all;font-size:12px;color:#ccc}
small a{color:var(--text)}
</style>
</head>
<body>
<h1>Event vorschlagen</h1>
<form id="f">
  <label>Titel *<input id="title" required placeholder="z.B. Spieleabend"></label>
  <div class="row">
    <label>Datum *<input id="date" type="date" required></label>
    <label>Uhrzeit<input id="time" placeholder="19:00"></label>
  </div>
  <div class="row">
    <label>Kategorie<select id="cat"><option>Verein</option><option>Spieleabend</option><option>Markt</option><option>Andere</option></select></label>
    <label>Ort<input id="place" placeholder="Burgstraße 28, 01662 Meißen"></label>
  </div>
  <div class="row">
    <label>Lat (51.161368)<input id="lat" type="number" step="any" placeholder="51.1613680"></label>
    <label>Lon (13.4716919)<input id="lon" type="number" step="any" placeholder="13.4716919"></label>
  </div>
  <button type="button" class="btn2" onclick="geocode()">📍 Koordinaten aus Adresse holen</button>
  <label>Beschreibung<textarea id="desc" placeholder="Worum gehts? Links werden automatisch klickbar"></textarea></label>
  <label>Weblink<input id="link" placeholder="https://..."></label>
  <label>Link-Text<input id="link_label" placeholder="Mehr Infos"></label>
  <button type="submit" class="btn">JSON erzeugen</button>
</form>

<div id="output" style="display:none">
  <strong>Fertig - das in deine events.json kopieren:</strong>
  <code id="json"></code>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn2" onclick="copyJSON()">Kopieren</button>
    <button class="btn2" onclick="mail()">Per Mail schicken</button>
  </div>
  <small style="display:block;margin-top:12px;color:var(--muted)">Tipp: Mit Mail schicken kommt es an <a href="mailto:deine@mail.de">deine@mail.de</a> - ändere die Adresse im Code unten.</small>
</div>

<script>
function geocode(){
  const q=document.getElementById('place').value;
  if(!q) return alert('Bitte Ort eingeben');
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`)
  .then(r=>r.json()).then(d=>{
    if(d[0]){document.getElementById('lat').value=d[0].lat;document.getElementById('lon').value=d[0].lon;}
    else alert('Nichts gefunden, versuch Straße + Stadt');
  });
}
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();
  const ev={
    title:document.getElementById('title').value,
    date:document.getElementById('date').value,
    time:document.getElementById('time').value||undefined,
    place:document.getElementById('place').value||undefined,
    cat:document.getElementById('cat').value,
    lat:parseFloat(document.getElementById('lat').value)||undefined,
    lon:parseFloat(document.getElementById('lon').value)||undefined,
    desc:document.getElementById('desc').value||undefined,
    link:document.getElementById('link').value||undefined,
    link_label:document.getElementById('link_label').value||undefined
  };
  Object.keys(ev).forEach(k=>ev[k]===undefined&&delete ev[k]);
  document.getElementById('json').textContent=JSON.stringify(ev,null,2)+',';
  document.getElementById('output').style.display='block';
  window.scrollTo(0,document.body.scrollHeight);
});
function copyJSON(){navigator.clipboard.writeText(document.getElementById('json').textContent);alert('Kopiert!')}
function mail(){
  const body=encodeURIComponent(document.getElementById('json').textContent);
  window.location.href=`mailto:deine@mail.de?subject=Neues Event für Meissen Kalender&body=${body}`;
}
</script>
</body>
</html>
