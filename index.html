<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEISSEN Veranstaltungskalender</title><style>:root{--bg:#0e0e12;--card:#1a1a22;--b:#262631;--t:#f2f2f5;--m:#8a8a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto} .wrap{max-width:760px;margin:0 auto;padding:14px}h1 small{display:block;font-size:13px;letter-spacing:3px;color:var(--m);text-align:center;margin:22px 0 6px}h1{margin:0;font-size:36px;text-align:center;line-height:1.1;letter-spacing:-1px;font-weight:900} .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid rgba(255,255,255,.08);white-space:nowrap}.chip.on{outline:2px solid #fff;outline-offset:2px}.dot{width:8px;height:8px;border-radius:50%} .c-spiele{background:#166534;color:#fff}.c-spiele .dot{background:#22ff88} .c-work{background:#1e4a8a;color:#fff}.c-work .dot{background:#5da8ff} .c-aus{background:#4c2a7a;color:#fff}.c-aus .dot{background:#b47bff} .c-markt{background:#d4a017;color:#000}.c-markt .dot{background:#000;opacity:.45} .c-konz{background:#a12a2a;color:#fff}.c-konz .dot{background:#ff6b6b} .c-alle{background:#2a2a38;color:#fff} .day{margin:24px 4px 10px;color:var(--m);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700} .event{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:16px;margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start} .badge{padding:5px 10px;border-radius:9px;font-size:11px;font-weight:800;white-space:nowrap;letter-spacing:.2px} .b-spiele{background:#0f2a1a;color:#3df48d;border:1px solid #164d2a} .b-work{background:#102a4a;color:#6ab0ff;border:1px solid #1a3f6a} .b-aus{background:#2a1a4a;color:#b88aff;border:1px solid #4a2a7a} .b-markt{background:#4a3a11;color:#ffde7a;border:1px solid #6a5a2a} .b-konz{background:#4a1515;color:#ff7a7a;border:1px solid #6a2a2a} .etitle{font-weight:800;font-size:17px;line-height:1.25} .emeta{font-size:13px;color:#bfbfd0;margin-top:4px;line-height:1.45} .emeta b{color:var(--t)}</style></head><body><div class="wrap">
<h1><small>MEISSEN</small>Veranstaltungskalender</h1>
<div class="chips" id="chips"></div>
<div id="list"></div>
</div>
<script>
let cats=[{id:'Alle',label:'Alle',cls:'c-alle'},{id:'Spieleabend',label:'Spieleabend',cls:'c-spiele'},{id:'Workshop',label:'Workshop',cls:'c-work'},{id:'Ausstellung',label:'Ausstellung',cls:'c-aus'},{id:'Markt',label:'Markt',cls:'c-markt'},{id:'Konzert',label:'Konzert',cls:'c-konz'}];
let active='Alle';let data=[];
function renderChips(){document.getElementById('chips').innerHTML=cats.map(c=>`<div class="chip ${c.cls} ${active===c.id?'on':''}" onclick="active='${c.id}';render()"><span class="dot"></span>${c.label}</div>`).join('')}
function fmt(d){return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase()}
function bClass(cat){if(cat==='Spieleabend')return 'b-spiele';if(cat==='Workshop')return 'b-work';if(cat==='Ausstellung')return 'b-aus';if(cat==='Markt')return 'b-markt';if(cat==='Konzert')return 'b-konz';return 'b-work'}
function render(){
 renderChips();
 let today=new Date().toISOString().slice(0,10);
 let f=data.filter(e=>e.date>=today).filter(e=>active==='Alle'||e.cat===active).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 let g={};f.forEach(e=>{if(!g[e.date])g[e.date]=[];g[e.date].push(e)});
 let h='';for(let d in g){
   h+=`<div class="day">HEUTE · ${fmt(d)}</div>`;
   g[d].forEach(ev=>{
     h+=`<div class="event"><div><span class="badge ${bClass(ev.cat)}">● ${ev.cat}</span></div><div><div class="etitle">${ev.title}</div><div class="emeta">${ev.time} · <b>${ev.place||''}</b><br>${ev.desc||''}</div></div></div>`;
   })
 }
 document.getElementById('list').innerHTML=h||'<div class="day">Keine kommenden Termine</div>';
}
fetch('events.json?t='+Date.now()).then(r=>r.json()).then(j=>{data=j;render()}).catch(()=>{data=[
{date:'2026-10-26',time:'19:00–22:00',cat:'Spieleabend',title:'Brettspielabend im Jugendclub',place:'Jugendclub Meißen, Neugasse 12',desc:'Offener Abend für Brettspiele · kostenfrei · 8/12 Plätze'},
{date:'2026-10-27',time:'14:00–17:00',cat:'Workshop',title:'Keramik-Workshop: Formen & Glasur',place:'Töpferwerkstatt, Burgstraße 9',desc:'Einsteiger-Workshop · Material inklusive · 5/10 Plätze'},
{date:'2026-10-28',time:'10:00–18:00',cat:'Ausstellung',title:'Ausstellung: Porzellan & Moderne',place:'Stadtmuseum Meißen, Heinrichsplatz 3',desc:'Zeitgenössische Keramik im Fokus · Eintritt 6 €'},
{date:'2026-10-29',time:'09:00–16:00',cat:'Markt',title:'Herbstmarkt auf dem Marktplatz',place:'Marktplatz Meißen',desc:'Regionale Produkte · Handwerk · Foodtrucks'},
{date:'2026-10-29',time:'20:30–22:30',cat:'Konzert',title:'Konzert: Jazz im Domkeller',place:'Domkeller Meißen, Domplatz 7',desc:'Jazz Quartett Live · Eintritt 15 €'}
];render()});
</script></body></html>
