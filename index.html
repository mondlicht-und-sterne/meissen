<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEISSEN Veranstaltungskalender</title><style>:root{--bg:#0e0e12;--card:#1a1a22;--b:#262631;--t:#f2f2f5;--m:#8a8a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui, -apple-system, Segoe UI, Roboto} .wrap{max-width:760px;margin:0 auto;padding:14px}h1 small{display:block;font-size:13px;letter-spacing:3px;color:var(--m);text-align:center;margin:22px 0 6px}h1{margin:0;font-size:36px;text-align:center;font-weight:900} .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;justify-content:safe center;scrollbar-width:none}.chips::-webkit-scrollbar{display:none} .chip{flex:0 0 auto;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.08);user-select:none}.chip.on{outline:2px solid #fff;outline-offset:2px} .c-spiele{background:#166534;color:#fff}.c-work{background:#1e4a8a;color:#fff}.c-aus{background:#4c2a7a;color:#fff}.c-markt{background:#d4a017;color:#000}.c-verein{background:#a12a2a;color:#fff}.c-alle{background:#2a2a38;color:#fff} .day{margin:24px 4px 10px;color:var(--m);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700} .event{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:16px;margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:12px} .badge{padding:5px 10px;border-radius:9px;font-size:11px;font-weight:800;white-space:nowrap} .b-spiele{background:#0f2a1a;color:#3df48d}.b-work{background:#102a4a;color:#6ab0ff}.b-aus{background:#2a1a4a;color:#b88aff}.b-markt{background:#4a3a11;color:#ffde7a}.b-verein{background:#4a1515;color:#ff7a7a} .etitle{font-weight:800;font-size:17px;line-height:1.2} .emeta{font-size:13px;color:#bfbfd0;margin-top:6px;line-height:1.4} .edays{font-size:11px;color:var(--m);margin-top:6px;font-weight:700;letter-spacing:.3px}</style></head><body><div class="wrap"><h1><small>MEISSEN</small>Veranstaltungskalender</h1><div class="chips" id="chips"></div><div id="list"></div></div>
<script>
let cats=[{id:'Alle',label:'Alle',cls:'c-alle'},{id:'Spieleabend',label:'Spieleabend',cls:'c-spiele'},{id:'Workshop',label:'Workshop',cls:'c-work'},{id:'Ausstellung',label:'Ausstellung',cls:'c-aus'},{id:'Markt',label:'Markt',cls:'c-markt'},{id:'Verein',label:'Verein',cls:'c-verein'}];
let active='Alle';let data=[];
function renderChips(){document.getElementById('chips').innerHTML=cats.map(c=>`<div class="chip ${c.cls} ${active===c.id?'on':''}" onclick="active='${c.id}';render()">${c.label}</div>`).join('')}
function fmtDay(d){return new Date(d).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()}
function fmtRange(a,b){
  if(!b || a===b) return fmtDay(a);
  let d1=new Date(a), d2=new Date(b);
  if(d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth()){
    return `${d1.getDate()}. BIS ${d2.getDate()}. ${d2.toLocaleDateString('de-DE',{month:'long',year:'numeric'}).toUpperCase()}`;
  }
  return `${d1.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'})} – ${d2.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'})}`.toUpperCase();
}
function bClass(cat){if(cat==='Spieleabend')return 'b-spiele';if(cat==='Workshop')return 'b-work';if(cat==='Ausstellung')return 'b-aus';if(cat==='Markt')return 'b-markt';if(cat==='Verein')return 'b-verein';return '';}
function isActiveOn(ev, todayStr){
  let start=ev.date, end=ev.date_end||ev.date;
  return todayStr>=start && todayStr<=end || todayStr<=end;
}
function render(){
  renderChips();
  let today=new Date().toISOString().slice(0,10);
  let f=data.filter(e=>isActiveOn(e,today));
  if(f.length===0) f=data; // wenn alles vorbei, zeig trotzdem alles
  f=f.filter(e=>active==='Alle'||!e.cat||e.cat===active).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let groups={};
  f.forEach(ev=>{
    let key=ev.date; // gruppiert nach Startdatum
    if(!groups[key]) groups[key]=[];
    groups[key].push(ev);
  });
  let html='';
  Object.keys(groups).sort().forEach(d=>{
    // finde ob ein Event ein Range ist für die Überschrift
    let hasRange = groups[d].some(ev=>ev.date_end && ev.date_end!==ev.date);
    if(hasRange){
      // für Range-Events eigene Überschrift
      groups[d].forEach(ev=>{
        html+=`<div class="day">${fmtRange(ev.date, ev.date_end)}</div>`;
        let badge=ev.cat?`<div><span class="badge ${bClass(ev.cat)}">${ev.cat}</span></div>`:`<div></div>`;
        let daysInfo = ev.date_end && ev.date_end!==ev.date ? `<div class="edays">${ev.date} → ${ev.date_end}</div>` : '';
        html+=`<div class="event">${badge}<div><div class="etitle">${ev.title}</div><div class="emeta">${ev.time||''} · <b>${ev.place||''}</b><br>${ev.desc||''}</div>${daysInfo}</div></div>`;
      });
    } else {
      html+=`<div class="day">${fmtDay(d)}</div>`;
      groups[d].forEach(ev=>{
        let badge=ev.cat?`<div><span class="badge ${bClass(ev.cat)}">${ev.cat}</span></div>`:`<div></div>`;
        html+=`<div class="event">${badge}<div><div class="etitle">${ev.title}</div><div class="emeta">${ev.time||''} · <b>${ev.place||''}</b><br>${ev.desc||''}</div></div></div>`;
      });
    }
  });
  document.getElementById('list').innerHTML=html||'<div style="text-align:center;color:var(--m);margin-top:40px">Keine Termine</div>';
}
let fallback=[
{date:'2026-11-08',time:'14:00–18:00',cat:'Verein',title:'Eröffnung: GEPARD e.V.',place:'Meißen',desc:'Feierliche Eröffnung - gepard-ev.de'},
{date:'2027-05-22',date_end:'2027-05-23',time:'10:00–18:00',cat:'Markt',title:'Meißner Töpfermarkt I',place:'Marktplatz Meißen',desc:'Keramik & Handwerk - 2 Tage'},
{date:'2026-11-20',time:'19:00–22:00',cat:'Spieleabend',title:'Spieleabend',place:'Jugendclub Neugasse 12, Meißen',desc:'Offener Abend - kostenfrei'}
];
fetch('events.json?t='+Date.now()).then(r=>{if(!r.ok) throw 0;return r.json()}).then(j=>{data=j;render()}).catch(()=>{data=fallback;render()});
</script></body></html>
