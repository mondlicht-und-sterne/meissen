<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meissen Kalender</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#fafaf7}
header{padding:16px 20px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
#map{height:420px;width:100%;border-bottom:1px solid #ddd}
.events{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin:12px 0;display:flex;gap:12px}
.badge{font-size:12px;background:#f0f0f0;padding:3px 8px;border-radius:999px}
.btn{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:#111;color:#fff;text-decoration:none;font-size:14px}
.btn:hover{background:#333}
small{color:#666}
.leaflet-popup-content a{color:#111;text-decoration:underline}
</style>
</head>
<body>
<header><h1 style="margin:0">Meissen Kalender</h1><small>Liste + Karte · OpenStreetMap</small></header>
<div id="map"></div>
<div class="events" id="events"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
async function load(){
  let data=[];
  try{
    const r=await fetch('events.json?t='+Date.now());
    data=await r.json();
  }catch(e){ 
    document.getElementById('events').innerHTML='<p>events.json nicht gefunden oder ungültig - bitte JSON prüfen</p>'; 
    return;
  }

  // Karte OSM
  const map=L.map('map').setView([51.1628,13.47],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  const bounds=[];

  const container=document.getElementById('events');
  data.sort((a,b)=> new Date(a.date)-new Date(b.date));
  data.forEach(ev=>{
    if(ev.lat && ev.lon){
      const m=L.marker([ev.lat,ev.lon]).addTo(map);
      m.bindPopup(`<b>${ev.title}</b><br>${ev.place}<br><small>${ev.date} ${ev.time||''}</small><br>${ev.link?`<a href="${ev.link}" target="_blank">${ev.link_label||'Link'}</a>`:''}`);
      bounds.push([ev.lat,ev.lon]);
    }
    const linkify=t=>(t||'').replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>');
    container.innerHTML+=`
      <div class="card">
        <div style="flex:1">
          <div><span class="badge">${ev.cat||''}</span> <small>${ev.date}${ev.date_end?' – '+ev.date_end:''} ${ev.time||''}</small></div>
          <h3 style="margin:6px 0">${ev.title}</h3>
          <small>${ev.place||''}</small>
          <p>${linkify(ev.desc||'')}</p>
          ${ev.link?`<a class="btn" href="${ev.link}" target="_blank" rel="noopener">${ev.link_label||'Mehr Infos'} ↗</a>`:''}
        </div>
      </div>`;
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[40,40]});
}
load();
</script>
</body>
</html>
