<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mondlicht & Sterne - Kalender Meißen</title>
<style>
:root{--bg:#1e1c18;--card:#2a2824;--text:#f0ece1;--muted:#a8a29a;--border:#3a3732;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px}
header{max-width:900px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px}
a.btn{padding:8px 14px;border-radius:999px;background:var(--text);color:#111;text-decoration:none;font-weight:800;font-size:13px}
#filters{max-width:900px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap}
#filters button{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px}
#filters button.active{background:var(--text);color:#111;border-color:var(--text)}
#calendar{max-width:900px;margin:0 auto;display:grid;gap:12px}
.day{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.dayHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dayDate{font-weight:900}
.dayWeekday{color:var(--muted);font-size:12px}
.event{border-left:3px solid var(--border);padding:8px 10px;margin:8px 0;background:#11110f;border-radius:8px}
.event.multi{border-left-color:var(--green)}
.eventTitle{font-weight:800;font-size:14px}
.eventMeta{font-size:12px;color:var(--muted);margin-top:2px}
.eventDesc{font-size:13px;margin-top:6px;line-height:1.4}
.badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--border);color:var(--muted);margin-left:6px}
.badge.multiBadge{background:var(--green);color:#111}
a.link{color:var(--green);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Meißen Kalender</h1>
  <a class="btn" href="formular.html">+ Event vorschlagen</a>
</header>
<div id="filters">
  <button data-cat="all" class="active">Alle</button>
  <button data-cat="Verein">Verein</button>
  <button data-cat="Spieleabend">Spieleabend</button>
  <button data-cat="Markt">Markt</button>
</div>
<div id="calendar">Lade events.json...</div>

<script>
let allEvents=[];
let activeCat='all';

function parseDate(str){ return str; } // YYYY-MM-DD bleibt vergleichbar

function isOnDay(ev, dayStr){
  if(!ev.date) return false;
  const start = ev.startDate || ev.date;
  const end = ev.endDate || ev.dateTo || ev.date;
  return dayStr >= start && dayStr <= end;
}
function formatLabel(ev){
  if((ev.dateTo && ev.dateTo!==ev.date) || (ev.endDate && ev.endDate!==ev.date)){
    const end = ev.endDate || ev.dateTo;
    return `${ev.date} → ${end}`;
  }
  return ev.date;
}
function isMulti(ev){
  return (ev.dateTo && ev.dateTo!==ev.date) || (ev.endDate && ev.endDate!==ev.date);
}

async function load(){
  try{
    const r=await fetch('events.json?'+Date.now());
    allEvents=await r.json();
  }catch(e){
    document.getElementById('calendar').textContent='events.json nicht gefunden';
    return;
  }
  render();
}

function render(){
  const cal=document.getElementById('calendar');
  cal.innerHTML='';
  // sammle alle relevanten Tage aus Events (nächste 60 Tage + alle Event-Tage)
  const daysSet=new Set();
  allEvents.forEach(ev=>{
    const start=ev.startDate||ev.date;
    const end=ev.endDate||ev.dateTo||ev.date;
    if(!start) return;
    let cur=new Date(start);
    const endD=new Date(end);
    for(let d=new Date(cur); d<=endD; d.setDate(d.getDate()+1)){
      daysSet.add(d.toISOString().slice(0,10));
    }
  });
  // sortiert
  const days=[...daysSet].sort();
  if(days.length===0){ cal.textContent='Keine Events'; return; }

  days.forEach(dayStr=>{
    const evs=allEvents.filter(e=>{
      const catMatch=activeCat==='all' || e.cat===activeCat;
      return catMatch && isOnDay(e, dayStr);
    });
    if(evs.length===0) return;
    const dayDiv=document.createElement('div');
    dayDiv.className='day';
    const d=new Date(dayStr);
    const weekday=d.toLocaleDateString('de-DE',{weekday:'long'});
    const nice=d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
    dayDiv.innerHTML=`<div class="dayHeader"><div class="dayDate">${nice}</div><div class="dayWeekday">${weekday}</div></div>`;
    evs.forEach(ev=>{
      const multi=isMulti(ev);
      const el=document.createElement('div');
      el.className='event'+(multi?' multi':'');
      el.innerHTML=`
        <div class="eventTitle">${ev.title||'Ohne Titel'} ${multi?`<span class="badge multiBadge">${formatLabel(ev)}</span>`:`<span class="badge">${ev.cat||''}</span>`}</div>
        <div class="eventMeta">${ev.time||''} ${ev.place?'· '+ev.place:''} ${!multi&&ev.cat?'· '+ev.cat:''}</div>
        ${ev.desc?`<div class="eventDesc">${ev.desc}</div>`:''}
        ${ev.link?`<a class="link" href="${ev.link}" target="_blank">${ev.link_label||'Mehr Infos →'}</a>`:''}
      `;
      dayDiv.appendChild(el);
    });
    cal.appendChild(dayDiv);
  });
}

document.querySelectorAll('#filters button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activeCat=b.dataset.cat;
    render();
  };
});

load();
</script>
</body>
</html>
